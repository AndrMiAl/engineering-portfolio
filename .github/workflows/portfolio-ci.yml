name: Portfolio checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python syntax
        run: python -m compileall -q examples

      - name: JSON syntax
        run: python -m json.tool examples/n8n-automation/workflow.example.json > /dev/null

      - name: Shell syntax
        run: bash -n examples/boberchik-infrastructure/healthcheck.sh

      - name: JavaScript syntax
        run: |
          node --check examples/pagekeeper/capture_flow.js
          node --check examples/pagekeeper/pagination.js

      - name: Local markdown links
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".").resolve()
          missing = []
          for md in root.rglob("*.md"):
              text = md.read_text(encoding="utf-8")
              for target in re.findall(r"\[[^\]]+\]\(([^)]+)\)", text):
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  path = (md.parent / target.split("#", 1)[0]).resolve()
                  if not path.exists():
                      missing.append((str(md), target))

          if missing:
              raise SystemExit("\n".join(f"{md}: {target}" for md, target in missing))
